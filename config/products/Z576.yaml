# Z576参考产品：M673；高PPI产品，Array段良率较低
# 数据加载相关的参数
data_source:
  product_code: "Z576"

# 本地文件读取
paths:
  static_warning_lines: 
    sheet_name: 'Z576'

  rate_override_config:
    sheet_name: "Z576"

  yield_modifier_config: {}

# 数据处理相关的参数
processing:
  use_local_snapshot: True
  snapshot_path: 'data/snapshot_Z576.parquet'
  
  defect_capping:
    enable: True

  defect_multipliers:
    # Array_Line
    # 'S向亮线': 0.6
    # Array_Pixel
    # Array_Mura
    # OLED_Mura


  sheet_hotspot_config: 
    enable: True
    random_seed: 2025
    hide_hotspot_config: {
        'fluctuation_sheet': 0.2,  
        'fluctuation_lot': 0.2,
    }
