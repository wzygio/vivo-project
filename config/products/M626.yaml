# 数据加载相关的参数
data_source:
  product_code: "M626"

# 资源位置由 global.yaml 管理；产品只指定工作簿 Sheet。
paths:
  static_warning_lines: 
    sheet_name: 'M626'
  
  rate_override_config:
    sheet_name: "M626"
    
  yield_modifier_config: {}

# 数据处理相关的参数
processing:
  use_local_snapshot: True
  snapshot_path: 'data/snapshot_M626.parquet'
  
  defect_capping:
    enable: True
  
  # 3. lot阵列投入时间
  array_input_time:
    custom_times:

  # 5. defect_code倍率调节
  defect_multipliers:
    # Array_Line
    # 'S向单暗线': 0.6
    # Array_Pixel
    # Array_Mura
    # OLED_Mura

  # 6. sheet/lot波动调节
  sheet_hotspot_config: 
    enable: True
    random_seed: 2025
    hide_hotspot_config: {
        'fluctuation_sheet': 0.2,  
        'fluctuation_lot': 0.2,
    }

# SPC 参数规格覆盖配置
# 用于手动调整特定产品-站点-参数的规格限制
spc_spec_override:
  - prod_code: "M626"
    step_id: "1L650"
    param_name: "CD1"
    ucl: 5.45
