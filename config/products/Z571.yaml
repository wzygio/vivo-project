# Z571同M678一致、

# 数据加载相关的参数
data_source:
  product_code: "Z571"

# 本地文件读取
paths:
  static_warning_lines: 
    sheet_name: 'Z571'

  rate_override_config:
    sheet_name: "Z571"

  yield_modifier_config: {}

# 数据处理相关的参数
processing:
  use_local_snapshot: True
  snapshot_path: 'data/snapshot_Z571.parquet'
  
  defect_capping:
    enable: True
  
  # 5. defect_code倍率调节
  defect_multipliers:
    # Array_Line
    # 'S向亮线': 0.7
    # # Array_Pixel
    # Array_Mura
    # OLED_Mura
    # TP
    
  sheet_hotspot_config: 
    enable: True
    random_seed: 2025
    hide_hotspot_config: {
        'fluctuation_sheet': 0.2,  
        'fluctuation_lot': 0.2,
    }
