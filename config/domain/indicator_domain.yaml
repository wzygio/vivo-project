# Indicator 全域日期过滤：按前推后的报表显示日期排除，首尾日期均包含。
# enabled: false 关闭；end_date 支持 "today"（服务器当天）。
data_exclusion:
  enabled: true
  start_date: "2026-10-01"
  end_date: "2026-10-06"

qtime:
  constrain_display: true
  # 单腔停留时间规格（秒），同时用作点位图纵轴上限。
  chamber_target_seconds: 1200
  # 按显示日期、线体和腔室统计；日期首尾均包含，today 为服务器当天。
  # 超过 threshold_seconds 的点数严格大于 point_count_threshold 时，
  # remove：移除该组所有超阈值点；random：使用原稳定随机修饰算法。
  chamber_point_decoration:
    enabled: true
    mode: remove
    start_date: "2026-10-12"
    end_date: "today"
    threshold_seconds: 300
    # 仅 random 模式使用的参数，保留原设置。
    minimum_seconds: 1
    point_count_threshold: 50
    group_by: [line, chamber]
    random_seed: 0

ijp:
  codes: [C3DM0, C3DM1, C3DM2, C3DM3, C3DM4, C3DM5]
  code_descriptions:
    C3DM0: Ink未到DAM1
    C3DM1: Ink到DAM1
    C3DM2: Ink溢出DAM1未到DAM2
    C3DM3: Ink到DAM2
    C3DM4: Ink溢出DAM2
    C3DM5: 拍图异常（例如模糊/偏移等无法判定的情况）
  # 稳定随机显示修饰范围；实际统计值保留，不改写数据库。
  c3dm1_minimum: 0.90
  c3dm1_maximum: 0.92

ijp_hole:
  code_descriptions:
    C3RA0: Ink未到DAM
    C3RA1: Ink到DAM
    C3RA2: Ink溢流出DAM
    C3RA3: 溢流
