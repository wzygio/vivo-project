array_input_time:
  # 暂停数据库查询和阵列时间排序；保留实现，后续按需显式启用。
  query_enabled: false

product_overrides:
  M626:
    paths:
      rate_override_config:
        sheet_name: M626
    processing:
      defect_capping: &defect_capping
        enable: true
      array_input_time:
        custom_times: null
      sheet_hotspot_config: &sheet_hotspot
        enable: true
        random_seed: 2025
        hide_hotspot_config:
          fluctuation_sheet: 0.2
          fluctuation_lot: 0.2
  M673:
    paths:
      rate_override_config:
        sheet_name: M673
    processing: &standard_processing
      defect_capping: *defect_capping
      sheet_hotspot_config: *sheet_hotspot
  M678:
    paths:
      rate_override_config:
        sheet_name: M678
    processing: &custom_array_times_processing
      defect_capping: *defect_capping
      array_input_time:
        custom_times:
          L3MR58E5C08: '20250805'
          L3MR58E5C03: '20250805'
          L3MR58E5C10: '20250805'
          L3MR58E5C26: '20250805'
          L3MR58E5C04: '20250805'
      sheet_hotspot_config: *sheet_hotspot
  Z517:
    paths:
      rate_override_config:
        sheet_name: Z517
    processing: *standard_processing
  Z553:
    paths:
      rate_override_config:
        sheet_name: Z553
    processing: *custom_array_times_processing
  Z571:
    paths:
      rate_override_config:
        sheet_name: Z571
    processing: *standard_processing
  Z576:
    paths:
      rate_override_config:
        sheet_name: Z576
    processing: *standard_processing
