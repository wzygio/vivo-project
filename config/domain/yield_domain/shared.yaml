dashboard:
  # 月均不良率图像门槛，两处共用：手动 Code 筛选、自动预警缺陷图像。
  # 使用小数比例：0.0001 = 0.01%；自动图像还必须命中预警。
  code_monthly_rate_threshold: 0.0001

product_overrides:
  M626:
    paths:
      static_warning_lines:
        sheet_name: M626
    processing:
      use_local_snapshot: true
      snapshot_path: data/snapshot_M626.parquet
      defect_multipliers: null
  M673:
    paths:
      static_warning_lines:
        sheet_name: M673
    processing:
      use_local_snapshot: true
      snapshot_path: data/snapshot_M673.parquet
      defect_multipliers:
        S向亮线: 0.6
        暗点: 0.7
        B暗点: 0.7
        群亮点: 0.5
        S向ELA Mura: 0
        G向ELA Mura: 0
        G向带状Mura: 0
        彩斑Mura: 0.4
        大面积片状彩斑Mura: 0
