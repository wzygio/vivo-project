# 应用程序级别的设置
application:
  cache_ttl_hours: 12 # 缓存时间（小时）

# 制造事实显示时间策略：客户报表展示源数据四天后的日期。
data_forward:
  enabled: true
  offset_days: 4

# 各 domain 配置文件路由（domain 配置文件路径的唯一真理来源）
domain_config:
  inline_domain: config/domain/inline_domain.yaml
  yield_domain: config/domain/yield_domain.yaml
  equipment_domain: config/domain/equipment_domain.yaml

product_registry:
  enabled_products:
    - "M626"
    - "M678"
    - "Z571"
    - "M673"
    - "Z517"
    - "Z576"
    - "Z553"

# Yield 域通用数据策略。产品配置只声明产品差异。
data_source:

  target_defect_groups:
    - "Array_Line"
    - "Array_Pixel"
    - "Array_Mura"
    - "OLED_Mura"
    - "TP_Short NG"
    - "TP 容值NG"

  work_order_types:
    - "ESLC" # 量产
    - "P" # 量产
    - "LCFG" # 量产返工
    - "SLCFG" # 试量产返工
    - "SYZLC" # 实验转量产
    
# UI界面相关的配置
ui:
  icons:
    home: "🏠"
    dashboard: "📊"
    chart_up: "📈"
    chart_down: "📉"
    report: "📋"
    datasheet: "📄"
    arrow_right: "➡️"
    rocket: "🚀"
    refresh: "🔄"
    settings: "⚙️"
    success: "✅"
    error: "❌"
    warning: "⚠️"
    info: "ℹ️"
