# 应用程序级别的设置
application:
  cache_ttl_hours: 12 # 缓存时间（小时）
  incremental_refresh_days: 7 # 增量刷新从原有截止点向前回刷的天数（正整数）

# 制造事实显示时间策略：客户报表展示源数据四天后的日期。
data_forward:
  enabled: true
  offset_days: 4

# 仅服务器当天的报表数据截止到此时刻（含）；日期前推在仓储边界换算。
# 历史日期仍保留整天；原始快照不截断，以便次日恢复完整历史。
report_cutoff:
  latest_day_time: "12:00:00"

# 各 domain 配置文件路由（domain 配置文件路径的唯一真理来源）
domain_config:
  inline_domain: config/domain/inline_domain.yaml
  yield_domain: config/domain/yield_domain.yaml
  equipment_domain: config/domain/equipment_domain.yaml
  indicator_domain: config/domain/indicator_domain.yaml
  iqc_domain: config/domain/iqc_domain.yaml

product_registry:
  enabled_products:
    - "M626"
    - "M678"
    - "Z571"
    - "M673"
    - "Z517"
    - "Z576"
    - "Z553"

  # 仅用于产品筛选框展示：M678（CPD2455）。缺失或留空时仅显示产品代码。
  # 此映射不控制产品启用范围，产品列表及顺序仍由 enabled_products 决定。
  product_annotations:
    M678: "CPD2455"
    M626: "CPD2515"
    M673: "CPD2449"
    Z517: "CPD2517"
    Z571: "CPD2571"
    Z559: "CPD2559"
    Z576: "CPD2576"
    Z611: "CPD2611"
    Z553: "CPD2553"

# Yield 域通用数据策略。产品配置只声明产品差异。
data_source:

  target_defect_groups:
    - "Array_Line"
    - "Array_Pixel"
    - "Array_Mura"
    - "OLED_Mura"
    - "TP_Short NG"
    - "TP 容值NG"

  work_order_types:
    - "ESLC" # 量产
    - "P" # 量产
    - "LCFG" # 量产返工
    - "SLCFG" # 试量产返工
    - "SYZLC" # 实验转量产
    
# UI界面相关的配置
ui:
  icons:
    home: "🏠"
    dashboard: "📊"
    chart_up: "📈"
    chart_down: "📉"
    report: "📋"
    datasheet: "📄"
    arrow_right: "➡️"
    rocket: "🚀"
    refresh: "🔄"
    settings: "⚙️"
    success: "✅"
    error: "❌"
    warning: "⚠️"
    info: "ℹ️"

