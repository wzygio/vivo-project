# 应用程序级别的设置
application:
  cache_ttl_hours: 12 # 缓存时间（小时）

# 数据快照缓存策略（各模块统一，唯一真理来源）
data_snapshot:
  ttl_hours: 12 # 数据快照缓存有效期（小时）

# Service 层 L2 缓存（@st.cache_data）TTL 统一配置，单位：小时
service_cache:
  ttl_hours:
    equipment_parts_report_payload: 1 # 关键备件报表 payload
    inline_spc_report_payload: 4 # SPC 报表 payload
    inline_decorated_features: 4 # Sheet OOS 修饰共享特征

product_registry:
  enabled_products:
    - "M626"
    - "M678"
    - "Z571"
    - "M673"
    - "Z517"
    - "Z576"
    - "Z553"

# Yield 域通用数据策略。产品配置只声明产品差异。
data_source:

  target_defect_groups:
    - "Array_Line"
    - "Array_Pixel"
    - "Array_Mura"
    - "OLED_Mura"
    - "TP_Short NG"
    - "TP 容值NG"

  work_order_types:
    - "ESLC" # 量产
    - "P" # 量产
    - "LCFG" # 量产返工
    - "SLCFG" # 试量产返工
    - "SYZLC" # 实验转量产
    
# UI界面相关的配置
ui:
  icons:
    home: "🏠"
    dashboard: "📊"
    chart_up: "📈"
    chart_down: "📉"
    report: "📋"
    datasheet: "📄"
    arrow_right: "➡️"
    rocket: "🚀"
    refresh: "🔄"
    settings: "⚙️"
    success: "✅"
    error: "❌"
    warning: "⚠️"
    info: "ℹ️"
