# 应用程序级别的设置
application:
  cache_ttl_hours: 4 # 缓存时间（小时）

product_registry:
  enabled_products:
    - "M626"
    - "M678"
    - "Z571"
    - "M673"
    - "Z517"

# Yield 域通用数据策略。产品配置只声明产品差异。
data_source:

  target_defect_groups:
    - "Array_Line"
    - "Array_Pixel"
    - "Array_Mura"
    - "OLED_Mura"
    - "TP_Short NG"
    - "TP 容值NG"

  work_order_types:
    - "ESLC" # 量产
    - "P" # 量产
    - "LCFG" # 量产返工
    - "SLCFG" # 试量产返工
    - "SYZLC" # 实验转量产
    
